name: global-r63-reference

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/global-r63-reference.yml"
      - "research/global_r63_reference.py.gz.b64"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests yfinance beautifulsoup4 pypdf lxml html5lib tabulate
      - name: Decode runner
        run: base64 -d research/global_r63_reference.py.gz.b64 | gzip -d > /tmp/global_r63_reference.py
      - name: Validate runner
        run: python -m py_compile /tmp/global_r63_reference.py
      - name: Run reference backtest
        env:
          OUTDIR: ${{ github.workspace }}/global_r63_results
        run: python /tmp/global_r63_reference.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-r63-reference-results
          path: global_r63_results
          if-no-files-found: warn
          retention-days: 7
